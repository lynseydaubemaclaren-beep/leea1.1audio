<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lets Enjoy English A1.1 Audio</title>
<style>
:root{--bg:#f3f1f7;--surface:#fff;--ink:#241a38;--muted:#6d6483;--line:#ddd7ea;--accent:#e08a00;--accent-ink:#1d1300;--active:#ece6fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#17122a;--surface:#221b3b;--ink:#efeaff;--muted:#a79dc4;--line:#372d57;--accent:#ffb02e;--active:#2e2550;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style",serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.title{font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
audio{width:100%;height:40px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:600 .85rem system-ui,sans-serif;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:transparent;color:var(--ink)}
button:hover{border-color:var(--accent)}
button.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);line-height:1.7}
code{font:.85em ui-monospace,Menlo,Consolas,monospace;background:var(--active);padding:1px 5px;border-radius:5px}
#app:has(.grid){max-width:980px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile .face{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:88px;padding:12px;border:0;border-radius:0;background:transparent;font:600 .95rem/1.3 Georgia,serif;overflow-wrap:anywhere}
.tile .face:hover{background:var(--active)}
.tile .body{display:none;padding:0 16px 16px}
.tile.open{grid-column:1/-1;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile.open .face{min-height:84px;font-size:1.5rem;background:var(--accent);color:var(--accent-ink);transition:min-height .2s}
.tile.open .body{display:block;padding-top:16px}
@media (prefers-reduced-motion:reduce){.tile.open .face{transition:none}}
body.solo main{padding-top:14px;padding-bottom:14px}
body.solo .card{margin:0}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ------------------------------------------------------------
   YOUR TRACKS
   Nothing to do here. The page lists every audio file in the
   "audio" folder of your repo automatically. Titles come from
   the file names (lesson-1.mp3 becomes "lesson 1").

   Only if you want custom titles, add lines like this:
   { file: "lesson-1.mp3", title: "Lesson 1: Greetings" },
------------------------------------------------------------ */
var TRACKS = [
  
];
var FOLDER = "audio/";
var OWNER = "lynseydaubemaclaren-beep";
var REPO = "leea1.1audio";
/* ---------------------------------------------------------- */

(function(){
  var app=document.getElementById('app');
  var base=location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/,'');
  var pageUrl=base+(location.pathname.split('/').pop()||'');

  function fileUrl(t){return base+FOLDER+encodeURIComponent(t.file)}
  function playerUrl(t){return pageUrl+'?t='+encodeURIComponent(t.file)}
  function embedCode(t){return '<iframe src="'+playerUrl(t)+'" width="100%" height="120" style="border:0" allow="autoplay"></iframe>'}

  function copy(text,btn,label){
    function ok(){btn.textContent='Copied';btn.classList.add('done');setTimeout(function(){btn.textContent=label;btn.classList.remove('done')},1600)}
    try{
      navigator.clipboard.writeText(text).then(ok,fallback);
    }catch(e){fallback()}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok()}catch(e){window.prompt('Copy this:',text)}
      document.body.removeChild(ta);
    }
  }

  function card(t,solo){
    var c=document.createElement('div');c.className='card';
    var h=document.createElement('div');h.className='title';h.textContent=t.title||t.file;
    var a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=fileUrl(t);
    c.appendChild(h);c.appendChild(a);
    if(!solo){
      var row=document.createElement('div');row.className='btns';
      [['Copy file link',function(){return fileUrl(t)}],
       ['Copy player link',function(){return playerUrl(t)}],
       ['Copy embed code',function(){return embedCode(t)}]].forEach(function(p){
        var b=document.createElement('button');b.type='button';b.textContent=p[0];
        b.onclick=function(){copy(p[1](),b,p[0])};row.appendChild(b);
      });
      c.appendChild(row);
    }
    return c;
  }

  function prettify(f){return f.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ')}
  function loadTracks(){
    if(TRACKS.length)return Promise.resolve();
    var m=location.hostname.match(/^(.+)\.github\.io$/);
    var owner=m?m[1]:OWNER;
    var repo=m?(location.pathname.split('/')[1]||owner+'.github.io'):REPO;
    return fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+FOLDER.replace(/\/$/,''))
      .then(function(r){if(!r.ok)throw new Error('list failed');return r.json()})
      .then(function(items){
        TRACKS=items
          .filter(function(i){return i.type==='file'&&/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(i.name)})
          .sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})})
          .map(function(i){return {file:i.name,title:prettify(i.name)}});
      })
      .catch(function(){});
  }

  function start(){
  var want=new URLSearchParams(location.search).get('t');
  if(want){
    document.body.classList.add('solo');
    var t=TRACKS.filter(function(x){return x.file===want})[0]||{file:want,title:want};
    app.appendChild(card(t,true));
    return;
  }

  var h1=document.createElement('h1');h1.textContent='Lets Enjoy English A1.1 Audio';
  var sub=document.createElement('p');sub.className='sub';
  sub.textContent='Tap a tile to open it and play the audio. Use the buttons to copy its link for Genially.';
  app.appendChild(h1);app.appendChild(sub);

  if(!TRACKS.length){
    var e=document.createElement('div');e.className='card empty';
    e.innerHTML='No tracks found. Upload audio files (mp3, wav, m4a, ogg, flac) to the <code>audio</code> folder of the repository, then reload this page.';
    app.appendChild(e);return;
  }
  var grid=document.createElement('div');grid.className='grid';
  TRACKS.forEach(function(t){grid.appendChild(tile(t))});
  app.appendChild(grid);
  }

  var openTile=null;
  function closeTile(c){
    c.classList.remove('open');
    c.querySelector('.face').setAttribute('aria-expanded','false');
    var a=c.querySelector('audio');if(a)a.pause();
    if(openTile===c)openTile=null;
  }
  function tile(t){
    var c=document.createElement('div');c.className='tile';
    var f=document.createElement('button');f.type='button';f.className='face';
    f.setAttribute('aria-expanded','false');f.textContent=t.title||t.file;
    var body=document.createElement('div');body.className='body';
    c.appendChild(f);c.appendChild(body);
    var a=null;
    f.onclick=function(){
      if(c.classList.contains('open')){closeTile(c);return}
      if(openTile)closeTile(openTile);
      if(!a){
        a=document.createElement('audio');a.controls=true;a.preload='auto';a.src=fileUrl(t);
        body.appendChild(a);
        var row=document.createElement('div');row.className='btns';
        [['Copy file link',function(){return fileUrl(t)}],
         ['Copy player link',function(){return playerUrl(t)}],
         ['Copy embed code',function(){return embedCode(t)}]].forEach(function(p){
          var b=document.createElement('button');b.type='button';b.textContent=p[0];
          b.onclick=function(){copy(p[1](),b,p[0])};row.appendChild(b);
        });
        body.appendChild(row);
      }
      c.classList.add('open');f.setAttribute('aria-expanded','true');openTile=c;
      a.play().catch(function(){});
      c.scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    return c;
  }
  loadTracks().then(start);
})();
</script>
</body>
</html>
